<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
  <nav class="navbar">

    <div class="logo">
        Amazon<span>Clone</span>
    </div>

    <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Products</a></li>
        <li><a href="#">Categories</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search Products...">
    </div>

    <div class="user-section">
        <span id="cartCount">🛒 Cart (0)</span>
        <span id="welcomeUser">Welcome User</span>
        <button id="logoutBtn">Logout</button>
    </div>

</nav>
<p id="homeMessage" class="message"></p>



    <!-- Banner -->
<section class="hero-banner">
    <div class="hero-content">
        <h1>Welcome to Amazon Clone</h1>
        <p>Discover amazing products at great prices.</p>
    </div>
</section>

    <!-- Products -->
    <section>
        <h2 class="product-heading">Products</h2>

        <div id="productContainer" class="products-grid">

        </div>
    </section>

<div id="cartModal" class="modal">

    <div class="modal-content">

        <span class="close" onclick="closeCart()">&times;</span>

        <h2>Your Cart</h2>

        <div id="cartItems"></div>

        <h3 id="cartTotal"></h3>

    </div>

</div>

    <!-- Footer -->
    <footer>
        <h3>Amazon Clone</h3>
        <p>About Us | Contact | Privacy Policy</p>
        <p>© 2026 All Rights Reserved</p>
    </footer>
    <div id="toast" class="toast"></div>
    <script src="script.js"></script>

</body>
</html>
